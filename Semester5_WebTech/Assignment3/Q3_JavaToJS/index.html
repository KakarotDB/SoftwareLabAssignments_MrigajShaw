<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Management System</title>
    <!-- External CSS link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bank Account Management System</h1>
        <p>Assignment 3 - Mrigaj Shaw</p>
    </header>

    <main class="container">
        <!-- Account Creation Section -->
        <section id="create-section" class="card">
            <h2>Create New Account</h2>
            <div class="form-group">
                <label for="holderName">Holder Name:</label>
                <input type="text" id="holderName" placeholder="e.g. Mrigaj Shaw">
            </div>
            <div class="form-group">
                <label for="accNum">Account Number:</label>
                <input type="text" id="accNum" placeholder="e.g. AC1001">
            </div>
            <div class="form-group">
                <label for="accType">Account Type:</label>
                <select id="accType">
                    <option value="Savings">Savings (5% Interest)</option>
                    <option value="Current">Current (₹1000 Overdraft)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="initBal">Initial Balance (₹):</label>
                <input type="number" id="initBal" placeholder="0.00" min="0">
            </div>
            <button onclick="createAccount()" class="btn-primary">Create Account</button>
        </section>

        <!-- Account Actions Section -->
        <section id="action-section" class="card" style="display: none;">
            <div class="account-info">
                <h2>Account Details</h2>
                <div class="info-grid">
                    <div><strong>Name:</strong> <span id="acc-info-name"></span></div>
                    <div><strong>Account No:</strong> <span id="acc-info-num"></span></div>
                    <div><strong>Type:</strong> <span id="acc-info-type"></span></div>
                    <div class="balance-display"><strong>Balance:</strong> <span id="acc-info-bal" class="animated-bal"></span></div>
                </div>
            </div>

            <div class="actions">
                <h3>Perform Transaction</h3>
                <div class="form-group">
                    <input type="number" id="amount" placeholder="Enter amount (₹)" min="1">
                </div>
                <div class="btn-group">
                    <button onclick="depositAmount()" class="btn-success">Deposit</button>
                    <button onclick="withdrawAmount()" class="btn-danger">Withdraw</button>
                </div>
            </div>

            <div class="transactions">
                <h3>Transaction History</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-body">
                        <!-- Transactions injected via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- External JS script -->
    <script src="bank_account.js"></script>
</body>
</html>
